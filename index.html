<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Key - AZEN System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            width: 350px;
            text-align: center;
            position: relative;
        }
        .counter {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 14px;
            color: #b0b0b0;
            background: #2a2a2a;
            padding: 4px 8px;
            border-radius: 5px;
        }
        h2 {
            margin-top: 10px;
            color: #00ffcc;
        }
        button {
            background-color: #00ffcc;
            color: #121212;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: 0.3s;
        }
        button:disabled {
            background-color: #444;
            color: #888;
            cursor: not-allowed;
        }
        button:hover:not(:disabled) {
            background-color: #00b38f;
        }
        .key-box {
            margin-top: 15px;
            background: #2a2a2a;
            padding: 10px;
            border-radius: 5px;
            word-break: break-all;
            font-family: monospace;
            color: #00ffcc;
            display: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Progress Counter in the top right -->
        <div class="counter" id="counterText">0/2</div>

        <h2>AZEN Key System</h2>
        <p>Complete the links to get your 24-hour key.</p>

        <!-- Linkvertise Step 1 Button -->
        <button id="btnStep1" onclick="toLinkvertise(1)">Skip Linkvertise 1</button>
        
        <!-- Linkvertise Step 2 Button -->
        <button id="btnStep2" onclick="toLinkvertise(2)" disabled>Skip Linkvertise 2</button>

        <!-- Generate Key Button -->
        <button id="btnGenerate" onclick="generateKey()" disabled>Generate Key</button>

        <!-- Result Key Box -->
        <div class="key-box" id="keyBox"></div>
    </div>

    <script>
        // Total steps required
        const totalSteps = 2;

        // Check status on page load
        window.onload = function() {
            let currentStep = parseInt(localStorage.getItem('azen_step')) || 0;
            let savedKey = localStorage.getItem('azen_key');

            updateUI(currentStep, savedKey);
        };

        // Function when linkvertise button is clicked
        function toLinkvertise(step) {
            // Replace with your actual Linkvertise URLs
            const linkvertiseURL = "https://link-target.net/xxxx/step-" + step; 

            // Save temporary progress
            localStorage.setItem('azen_current_target', step);
            
            // Redirect to Linkvertise
            window.location.href = linkvertiseURL;
        }

        // Handle return from Linkvertise using URL parameter (e.g., yourwebsite.com/?step=1)
        const urlParams = new URLSearchParams(window.location.search);
        const completedStep = urlParams.get('step');
        
        if (completedStep) {
            localStorage.setItem('azen_step', completedStep);
            window.location.href = window.location.pathname; // Clean URL
        }

        // Update UI based on progress
        function updateUI(step, key) {
            const counterText = document.getElementById('counterText');
            const btnStep1 = document.getElementById('btnStep1');
            const btnStep2 = document.getElementById('btnStep2');
            const btnGenerate = document.getElementById('btnGenerate');
            const keyBox = document.getElementById('keyBox');

            counterText.innerText = `${step}/${totalSteps}`;

            if (key) {
                // If user already generated a key
                btnStep1.style.display = 'none';
                btnStep2.style.display = 'none';
                btnGenerate.style.display = 'none';
                counterText.style.display = 'none';
                keyBox.style.display = 'block';
                keyBox.innerText = "Your Key: " + key;
                return;
            }

            if (step >= 1) {
                btnStep1.innerText = "Completed ✓";
                btnStep1.disabled = true;
                btnStep2.disabled = false;
            }

            if (step >= 2) {
                btnStep2.innerText = "Completed ✓";
                btnStep2.disabled = true;
                btnGenerate.disabled = false; // Unlock generate button
            }
        }

        // Function to generate key with "AZEN-" prefix
        function generateKey() {
            const randomString = Math.random().toString(36).substring(2, 10).toUpperCase();
            const finalKey = "AZEN-" + randomString + "-" + Math.floor(Math.random() * 8999 + 1000);

            // Save key to localStorage to lock it and prevent generating again
            localStorage.setItem('azen_key', finalKey);

            // Refresh UI
            updateUI(2, finalKey);
        }
    </script>
</body>
</html>
